name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  XWIN_VERSION: 0.6.5

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Configure
        run: xmake f -m release -y --dotnet_root="$DOTNET_ROOT"

      - name: Test
        run: |
          dotnet test managed/tests/NanosSharp.Host.Tests -c Release
          dotnet test managed/tests/NanosSharp.Installer.Tests -c Release

      - name: Bundle runtime
        run: xmake bundle -r "${{ steps.version.outputs.version }}"

      - name: Pack NuGet packages
        run: |
          dotnet pack managed/NanosSharp.slnx -c Release -p:Version="${{ steps.version.outputs.version }}"
          dotnet pack managed/NanosSharp/NanosSharp.csproj -c Release -p:NanosSharpSide=Client -p:Version="${{ steps.version.outputs.version }}"
          dotnet pack managed/NanosSharp/NanosSharp.csproj -c Release -p:NanosSharpSide=Shared -p:Version="${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: build/release/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build/packages/
          if-no-files-found: error

  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Install clang-cl and lld-link
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        id: xwin-cache
        with:
          path: ~/.xwin
          key: xwin-${{ env.XWIN_VERSION }}

      - name: Download the MSVC CRT and Windows SDK
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/xwin-$XWIN_VERSION-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          "./xwin-$XWIN_VERSION-x86_64-unknown-linux-musl/xwin" --accept-license splat --output ~/.xwin

      - name: Configure
        run: xmake f -m release -y --dotnet_root="$DOTNET_ROOT"

      - name: Bundle client
        run: xmake client -r "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: build/release/*.zip
          if-no-files-found: error

  installer:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
            file: nanossharp-install
          - os: windows-2025
            runtime: win-x64
            file: nanossharp-install.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish managed/tools/NanosSharp.Installer/NanosSharp.Installer.csproj -c Release -r "${{ matrix.runtime }}" \
            -p:Version="$version" -o build/installer
          mkdir -p build/release
          name="${{ matrix.file }}"
          cp "build/installer/$name" "build/release/${name/nanossharp-install/nanossharp-install-${{ matrix.runtime }}}"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.runtime }}
          path: build/release/
          if-no-files-found: error

  nuget:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - id: login
        uses: NuGet/login@v1
        with:
          user: Das_Darki

      - name: Push packages
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    needs: [build, client, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: client
          path: release

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true

      - name: Write checksums
        run: cd release && sha256sum *.tar.gz *.zip nanossharp-install-* > SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/nanossharp-install-*

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/nanossharp-install-*
            release/SHA256SUMS
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true

  docker:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: build/release

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dasdarki/nanossharp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.build.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_REFRESH=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
